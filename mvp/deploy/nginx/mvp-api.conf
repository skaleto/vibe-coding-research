# ============================================================================
# mvp-api.conf — HTTPS reverse proxy for the MVP Node backends on Aliyun ECS.
#
#   client ──HTTPS:443──> nginx (terminates TLS) ──HTTP──> 127.0.0.1:8400 gateway
#                                                  └──────> 127.0.0.1:8401 ota
#
# Coexists with ai-baby (Java, :8300) on the same host. The Node services bind
# 127.0.0.1 only (loopback) — nginx is the single public entry point.
#
# PREREQUISITES (see mvp/docs/aliyun-deploy.md):
#   1. A domain whose root has completed 阿里云 ICP 备案 (ICP filing). 备案 is a
#      legal prerequisite for serving any HTTP(S) site from a mainland-China ECS;
#      it typically takes 7–20 calendar days. Without it, port 80/443 traffic to
#      the public IP is blocked by the carrier.
#   2. A TLS certificate for api-mvp.<YOUR_DOMAIN>. Two free options:
#        a) 阿里云免费证书 (DigiCert DV, 1-year): apply in 数字证书管理服务 →
#           免费证书, download the "Nginx" bundle (.pem + .key), upload to the
#           paths below.
#        b) certbot / Let's Encrypt:  certbot --nginx -d api-mvp.<YOUR_DOMAIN>
#           (auto-rewrites this file; comment out the manual ssl_* lines first).
#
# INSTALL:
#   sudo cp mvp-api.conf /etc/nginx/conf.d/mvp-api.conf
#   # edit: replace <YOUR_DOMAIN> and the ssl_certificate paths
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

# --- Shared upstreams (keepalive to the loopback Node processes) ------------
upstream mvp_gateway {
    server 127.0.0.1:8400;
    keepalive 32;
}
upstream mvp_ota {
    server 127.0.0.1:8401;
    keepalive 32;
}

# --- 80 → 443 redirect ------------------------------------------------------
# (If you use certbot, it inserts its ACME http-01 location here automatically.)
server {
    listen 80;
    listen [::]:80;
    server_name api-mvp.<YOUR_DOMAIN>;

    # Allow ACME challenges over HTTP if you use certbot/webroot; harmless otherwise.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 443 TLS termination + reverse proxy ------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api-mvp.<YOUR_DOMAIN>;

    # --- TLS certificate (replace with your real paths) ---------------------
    # 阿里云免费证书: upload the downloaded Nginx bundle here.
    # certbot: these become /etc/letsencrypt/live/api-mvp.<YOUR_DOMAIN>/{fullchain,privkey}.pem
    ssl_certificate     /etc/nginx/ssl/api-mvp.<YOUR_DOMAIN>.pem;
    ssl_certificate_key /etc/nginx/ssl/api-mvp.<YOUR_DOMAIN>.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:MvpTLS:10m;
    ssl_session_timeout 1d;

    # HSTS — only enable once you are confident HTTPS is stable (1y, includeSubDomains).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # OTA bundle uploads (publish-bundle.sh POSTs a zip object key + manifest; the
    # zip itself goes straight to OSS, but raise this so admin JSON / future direct
    # uploads are not truncated). Gateway bodies (prompts/images) are small.
    client_max_body_size 25m;

    # ====================================================================
    # SECURITY — client-IP headers (load-bearing; do NOT relax)
    # ====================================================================
    # The gateway rate-limiter (gateway/src/middleware/rateLimit.ts::getClientIp)
    # trusts ONLY headers that THIS nginx injects:
    #     X-Real-IP        — preferred bucket key
    #     X-Forwarded-For  — fallback (first hop)
    # Both are set from $remote_addr (the real TCP peer) and OVERWRITE whatever
    # the client sent. We must NOT append the client's original X-Forwarded-For:
    # if we did, an attacker could rotate `X-Forwarded-For: <random>` per request
    # to mint a fresh rate-limit bucket every time and bypass quota entirely
    # (unlimited LLM abuse / billing attack). Hence "overwrite, not append".
    #
    # These proxy_set_header directives live at the server level so they apply to
    # BOTH location blocks below (nginx inherits them unless a location re-declares
    # any proxy_set_header, in which case ALL must be repeated — they are not here).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;   # real peer, not client-supplied
    proxy_set_header X-Forwarded-For   $remote_addr;   # OVERWRITE — never $proxy_add_x_forwarded_for
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Connection "";        # enable upstream keepalive
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;             # LLM calls can be slow; matches gateway Retry-After
    proxy_send_timeout    60s;

    # --- /gateway/ → mvp-gateway :8400 --------------------------------------
    # Trailing slash on both sides strips the /gateway prefix:
    #   POST /gateway/generate-names  →  upstream POST /generate-names
    location /gateway/ {
        proxy_pass http://mvp_gateway/;
    }

    # --- /ota/ → mvp-ota :8401 ----------------------------------------------
    #   POST /ota/mobile-updates/check  →  upstream POST /mobile-updates/check
    #   POST /ota/admin/manifest        →  upstream POST /admin/manifest
    location /ota/ {
        proxy_pass http://mvp_ota/;
    }

    # Optional: a top-level health passthrough for uptime monitors.
    location = /healthz {
        access_log off;
        proxy_pass http://mvp_gateway/health;
    }
}
